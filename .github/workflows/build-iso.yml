name: ISO bauen

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['website/**', 'docs/**', '**.md']
  pull_request:
    paths-ignore: ['website/**', 'docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    container:
      image: archlinux:latest
      # mkarchiso braucht Root-Rechte im Container (Dateisystem-Images, Rechte setzen).
      options: --privileged
    steps:
      - name: Werkzeuge installieren
        run: pacman -Syu --noconfirm --needed archiso git

      - uses: actions/checkout@v4

      - name: ISO bauen
        run: ./iso/build.sh

      - name: Prüfsumme
        run: cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS

      - name: ISO als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: eddyos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 14
          compression-level: 0

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
          generate_release_notes: true
